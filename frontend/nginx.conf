server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router) - unknown paths fall back to
    # index.html rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker and manifest should never be cached aggressively -
    # they're how PWA updates propagate.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
